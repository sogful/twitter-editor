<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Edit photos with the filters and stickers from Twitter's 2021 app." />
    <title>Twitter photo editor</title>
    <link rel="icon" href="./assets/icons/photo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="page">
    <div class="application">
      <main class="editor empty">
        <header class="topbar">
          <button class="toolclose button" type="button" aria-label="Back" title="Back">
            <span class="icon iconclose" aria-hidden="true"></span>
          </button>
          <h1 class="title">Edit photo</h1>
          <button class="historybutton button undo" type="button" aria-label="Undo" title="Undo" disabled>
            <span class="icon iconhistory" aria-hidden="true"></span>
          </button>
          <button class="historybutton button redo" type="button" aria-label="Redo" title="Redo" disabled>
            <span class="icon iconhistory iconredo" aria-hidden="true"></span>
          </button>
          <button class="donebutton button" type="button">Done</button>
        </header>
        <section class="workspace" aria-label="Photo preview">
          <div class="canvasbox">
            <canvas class="photocanvas" aria-label="Edited photo"></canvas>
            <div class="cropguide off">
              <button class="crophandle croptopleft" type="button" data-handle="topleft" aria-label="Resize crop from top left"></button>
              <button class="crophandle croptopright" type="button" data-handle="topright" aria-label="Resize crop from top right"></button>
              <button class="crophandle cropbottomleft" type="button" data-handle="bottomleft" aria-label="Resize crop from bottom left"></button>
              <button class="crophandle cropbottomright" type="button" data-handle="bottomright" aria-label="Resize crop from bottom right"></button>
            </div>
            <div class="stickerlayers"></div>
            <div class="dropnotice off">Drop an image to edit it</div>
          </div>
        </section>
        <section class="filterpanel off" aria-label="Filters">
          <div class="filterstrip"></div>
          <label class="intensityrow">
            <span>Intensity</span>
            <input class="intensity input" type="range" min="0" max="100" value="100" aria-label="Filter intensity" />
            <span class="intensityvalue">100</span>
          </label>
        </section>
        <section class="croppanel off" aria-label="Crop image">
          <div class="cropchoices">
            <button class="cropchoice button" type="button" data-crop="Original" aria-pressed="true">
              <span class="icon iconoriginal" aria-hidden="true"></span>
              <span>Original</span>
            </button>
            <button class="cropchoice button" type="button" data-crop="Wide" aria-pressed="false">
              <span class="icon iconwide" aria-hidden="true"></span>
              <span>Wide</span>
            </button>
            <button class="cropchoice button" type="button" data-crop="Square" aria-pressed="false">
              <span class="icon iconsquare" aria-hidden="true"></span>
              <span>Square</span>
            </button>
            <button class="rotatebutton button" type="button" aria-label="Rotate image clockwise">
              <span class="icon iconrotate" aria-hidden="true"></span>
              <span>Rotate</span>
            </button>
          </div>
        </section>
        <section class="stickerpanel off" aria-label="Sticker picker">
          <div class="categorystrip" aria-label="Sticker categories"></div>
          <div class="variantstrip off" aria-label="Sticker variations"></div>
          <div class="stickergallery"></div>
          <div class="stickerstate off"></div>
        </section>
        <footer class="footer">
          <nav class="toolbar" aria-label="Photo editing tools">
            <button class="toolbutton button" type="button" data-tool="enhance" aria-label="Enhance" aria-pressed="false" title="Enhance">
              <span class="icon iconenhance" aria-hidden="true"></span>
            </button>
            <button class="toolbutton button" type="button" data-tool="filters" aria-label="Filters" aria-pressed="false" title="Filters">
              <span class="icon iconfilter" aria-hidden="true"></span>
            </button>
            <button class="toolbutton button" type="button" data-tool="crop" aria-label="Crop" aria-pressed="false" title="Crop">
              <span class="icon iconcrop" aria-hidden="true"></span>
            </button>
            <button class="toolbutton button" type="button" data-tool="sticker" aria-label="Stickers" aria-pressed="false" title="Stickers">
              <span class="icon iconsticker" aria-hidden="true"></span>
            </button>
          </nav>
        </footer>
        <input class="fileinput input" type="file" accept="image/*" aria-label="Choose an image" />
      </main>
      <section class="startscreen" aria-label="Choose a photo">
        <div class="startcontent">
          <h2 class="starttitle">Add a photo</h2>
          <p class="startmessage">Choose an image or try the sample photo.</p>
          <div class="startactions">
            <button class="startbutton primarybutton button openimage" type="button">Open image</button>
            <button class="startbutton secondarybutton button usesample" type="button">Use a sample</button>
          </div>
        </div>
      </section>
      <div class="toast off" role="status"></div>
    </div>
    <script defer src="./src/state.js"></script>
    <script defer src="./src/filters.js"></script>
    <script defer src="./src/stickers.js"></script>
    <script defer src="./src/images.js"></script>
    <script defer src="./src/render.js"></script>
    <script defer src="./src/controls.js"></script>
    <script defer src="./src/app.js"></script>
  </body>
</html>
